version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mini-dex-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_dex
    volumes:
      - mini_dex_pg:/var/lib/postgresql/data

volumes:
  mini_dex_pg:
